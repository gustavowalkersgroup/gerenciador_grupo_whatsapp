name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: ggw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d ggw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dev:dev@localhost:5432/ggw
      TEST_DATABASE_URL: postgresql://dev:dev@localhost:5432/ggw
      # Valores fictícios: o build precisa das variáveis, mas nada aqui
      # conversa com a Evolution de verdade.
      EVOLUTION_API_URL: http://127.0.0.1:9
      EVOLUTION_API_KEY: ci
      WEBHOOK_SECRET: ci-webhook-secret-com-32-caracteres
      CRON_SECRET: ci-cron-secret-com-32-caracteres!!
      AUTH_SECRET: ci-auth-secret-com-32-caracteres!!

    steps:
      - uses: actions/checkout@v4

      # Sem `version:` de propósito: a versão vem do campo packageManager do
      # package.json. Declarar nos dois lugares faz a action abortar.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Aplicar migrations
        run: psql "$DATABASE_URL" -f drizzle/0000_inicial.sql

      - name: Checagem de tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build
